AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: JavaEats - item-service (SAM local)

Globals:
  Function:
    Runtime: java21
    CodeUri: item-service/target/item-service-0.0.1-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker
    Timeout: 30
    MemorySize: 512
    SnapStart:
      ApplyOn: PublishedVersions
    AutoPublishAlias: live
    Environment:
      Variables:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db
        SPRING_DATASOURCE_USERNAME: user
        SPRING_DATASOURCE_PASSWORD: password

Resources:
  MyAppApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MyAppApiLocal
      StageName: local
      Cors:
        AllowOrigin: "'http://localhost:3000'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"

  ItemListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: listItems
      Events:
        MyApi:
          Type: Api
          Properties:
            RestApiId: !Ref MyAppApi
            Path: /item/list
            Method: get

  ItemGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: getItem
      Events:
        MyApi:
          Type: Api
          Properties:
            RestApiId: !Ref MyAppApi
            Path: /item/{id}
            Method: get

  ItemCategoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: listCategories
      Events:
        MyApi:
          Type: Api
          Properties:
            RestApiId: !Ref MyAppApi
            Path: /item/category
            Method: get

  OrderCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: order-service/target/order-service-0.0.1-SNAPSHOT.jar
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: createOrder
      Events:
        MyApi:
          Type: Api
          Properties:
            RestApiId: !Ref MyAppApi
            Path: /order
            Method: post

  OrderListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: order-service/target/order-service-0.0.1-SNAPSHOT.jar
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: listOrders
      Events:
        MyApi:
          Type: Api
          Properties:
            RestApiId: !Ref MyAppApi
            Path: /order/list
            Method: get

  OrderGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: order-service/target/order-service-0.0.1-SNAPSHOT.jar
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: getOrder
      Events:
        MyApi:
          Type: Api
          Properties:
            RestApiId: !Ref MyAppApi
            Path: /order/{id}
            Method: get