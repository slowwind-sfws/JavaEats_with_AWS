# localstack/docker-compose.yml
services:
  mysql:
    image: mysql:8.0.27
    ports:
      - "3306:3306"
    networks:
      - sam-network
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: 'Asia/Tokyo'
    volumes:
      - db-data:/var/lib/mysql

  # phpmyadmin:
  #   image: phpmyadmin
  #   networks:
  #     - sam-network
  #   depends_on:
  #     - mysql
  #   environment:
  #     - PMA_ARBITRARY=1
  #     - PMA_HOSTS=mysql
  #     - PMA_USER=root
  #     - PMA_PASSWORD=mysql
  #   ports:
  #     - "8080:80"

  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    networks:
      - sam-network
    environment:
      AWS_DEFAULT_REGION: ap-northeast-1
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - floci-data:/app/data

networks:
  sam-network:
    external: true  # docker network create sam-network で作成した外部ネットワーク

volumes:
  db-data:
  floci-data:
